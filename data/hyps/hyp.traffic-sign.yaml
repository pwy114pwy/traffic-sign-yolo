# Ultralytics YOLOv5 交通标志识别优化超参数配置
# 针对多目标检测和泛化能力优化

# 学习率设置
lr0: 0.01  # 初始学习率 (SGD=1E-2, Adam=1E-3)
lrf: 0.01  # 最终学习率 (lr0 * lrf)
momentum: 0.937  # SGD动量/Adam beta1
weight_decay: 0.0005  # 优化器权重衰减
warmup_epochs: 3.0  # 预热轮数
warmup_momentum: 0.8  # 预热初始动量
warmup_bias_lr: 0.1  # 预热初始偏置学习率

# 损失函数权重
box: 0.05  # 边界框损失增益
cls: 0.5  # 分类损失增益
cls_pw: 1.0  # 分类BCELoss正样本权重
obj: 1.0  # 目标损失增益
obj_pw: 1.0  # 目标BCELoss正样本权重
iou_t: 0.20  # IoU训练阈值
anchor_t: 4.0  # anchor倍数阈值
fl_gamma: 0.0  # focal loss gamma

# ========================================
# 数据增强配置 - 针对交通标志优化
# ========================================

# 颜色空间增强 - 提高对不同光照条件的适应性
hsv_h: 0.015  # 色调增强 (0-1) - 轻微调整,保持标志颜色识别
hsv_s: 0.7    # 饱和度增强 (0-1) - 强增强,适应不同天气
hsv_v: 0.4    # 亮度增强 (0-1) - 适应白天/夜晚/阴影

# 几何变换增强 - 提高对不同角度和距离的适应性
degrees: 15.0      # 旋转角度 (+/- deg) - 模拟不同拍摄角度
translate: 0.2     # 平移 (+/- fraction) - 模拟不同位置
scale: 0.9         # 缩放 (+/- gain) - 模拟不同距离
shear: 5.0         # 剪切 (+/- deg) - 模拟透视变换
perspective: 0.0005  # 透视变换 (0-0.001) - 模拟3D视角

# 翻转增强
flipud: 0.0   # 上下翻转 - 关闭,交通标志不应倒置
fliplr: 0.5   # 左右翻转 - 50%概率,部分标志对称

# ========================================
# 高级增强 - 关键改进!
# ========================================

# Mosaic增强 - 将4张图片拼接,自动创建多目标场景
mosaic: 1.0   # 100%使用mosaic,强制模型学习多目标检测

# MixUp增强 - 混合两张图片,提高泛化能力
mixup: 0.15   # 15%概率使用mixup

# Copy-Paste增强 - 复制目标到其他图片,模拟复杂场景
copy_paste: 0.3  # 30%概率使用copy-paste,增加多目标训练样本
